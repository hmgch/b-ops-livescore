<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="開催中・公開中の大会を選択して、試合結果と進行状況を確認できます。"
    />
    <title>大会一覧 | 試合結果・速報</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f8fafc;
      }
    </style>
    <script src="./config.js"></script>
    <script src="./portal.js" defer></script>
  </head>
  <body class="min-h-screen p-4">
    <main class="mx-auto max-w-2xl">
      <header class="mb-6 px-2">
        <h1 class="text-2xl font-extrabold text-slate-900">大会一覧</h1>
        <p class="mt-2 text-sm text-slate-600">
          閲覧する大会を選択してください。
        </p>
      </header>
      <section
        id="tournament-list"
        class="grid gap-3 sm:grid-cols-2"
        aria-label="公開中の大会"
      >
        <p class="text-sm text-slate-500" role="status">大会一覧を読み込んでいます...</p>
      </section>
      <p id="portal-message" class="mt-4 text-sm text-slate-600" role="status"></p>
    </main>
  </body>
</html>
