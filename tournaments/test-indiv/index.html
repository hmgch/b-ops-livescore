<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="個人戦テスト大会の試合結果と進行状況をお知らせします。"
    />
    <title>個人戦テスト大会 | 試合結果・速報</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f8fafc;
      }
    </style>
    <script src="./config.js"></script>
    <script src="../../app.js" defer></script>
  </head>
  <body class="min-h-screen p-2 sm:p-4">
    <main class="mx-auto max-w-2xl">
      <header class="mb-4 flex items-center justify-between gap-3 px-2">
        <h1 class="flex items-center gap-2 text-lg font-bold text-slate-800">
          <span
            id="status-dot"
            class="inline-block h-2.5 w-2.5 rounded-full bg-amber-400"
            aria-hidden="true"
          ></span>
          <span id="site-title">試合結果・速報</span>
        </h1>
        <div class="text-right">
          <p id="last-updated" class="text-xs text-slate-500" aria-live="polite">
            読み込み中...
          </p>
          <p id="connection-message" class="mt-1 text-xs text-amber-700" role="status"></p>
        </div>
      </header>
      <section
        id="match-container"
        class="space-y-3"
        aria-label="試合一覧"
      >
        <div
          class="flex animate-pulse items-center justify-between rounded-xl border border-slate-100 bg-white p-4 shadow-sm"
          aria-label="試合データを読み込んでいます"
        >
          <div class="h-10 w-1/3 rounded bg-slate-200"></div>
          <div class="h-8 w-1/4 rounded bg-slate-200"></div>
          <div class="h-10 w-1/3 rounded bg-slate-200"></div>
        </div>
      </section>
    </main>
  </body>
</html>
